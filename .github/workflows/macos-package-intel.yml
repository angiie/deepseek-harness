# Build an unsigned Intel Mac installer without API credentials or signing secrets.
# Push/manual builds retain a DMG artifact; release builds also attach it to the Release.
name: Package Desktop · macOS Intel (x64)

on:
  push:
    branches: [master]
  workflow_dispatch:
  release:
    types: [released]

permissions:
  contents: write

concurrency:
  group: macos-intel-desktop-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Configure persistent package caches
        env:
          DSH_DESKTOP_PACKAGE_CACHE_DIR: ${{ runner.tool_cache }}/dsh-desktop-package-cache
        run: |
          echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=$DSH_DESKTOP_PACKAGE_CACHE_DIR" >> "$GITHUB_ENV"
          echo "PNPM_CONFIG_STORE_DIR=$DSH_DESKTOP_PACKAGE_CACHE_DIR/workspace-pnpm-store" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check packaging configuration and toolchain
        run: pnpm run package:desktop:mac:x64:unsigned --check
      - name: Build unsigned Intel (x64) installer
        run: pnpm run package:desktop:mac:x64:unsigned
      - name: Retain Intel (x64) installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-x64-unsigned
          path: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload DMG to release
        if: success() && github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: apps/desktop/.desktop-build/targets/mac-x64/unsigned-artifacts/*.dmg
          fail_on_unmatched_files: true
